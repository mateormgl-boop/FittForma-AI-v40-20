services:
  - type: web
    # Se conserva el nombre existente para no arriesgar el dominio de Render ya desplegado.
    name: fittforma-ai-v19-final
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TRUST_RENDER_CLIENT_IP
        value: "true"
      # v48 — monetización (apagada por defecto). Detalle en docs/MONETIZACION.md.
      - key: MONETIZATION_ENABLED
        value: "false"
      - key: ADS_PROVIDER
        value: none
      - key: APP_TIMEZONE
        value: America/Montevideo
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
